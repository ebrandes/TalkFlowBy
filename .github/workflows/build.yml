name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            os: macos-latest
            dist: npm run dist:mac -- --arm64
          - name: mac-intel
            os: macos-15-intel
            dist: npm run dist:mac -- --x64
          - name: windows
            os: windows-latest
            dist: npm run dist:win
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Vulkan SDK para compilar o Whisper que usa a placa de vídeo no Windows.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe --fail -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw 'Vulkan SDK não foi instalado.' }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Abre o app compilado e confere o básico (janela, sandbox, criar e salvar nota).
      - run: npm run test:app
      - name: Build installer
        shell: bash
        # Sem os segredos de assinatura o instalador sai sem assinar (com aviso do sistema).
        # Com eles, sai assinado e, no Mac, notarizado. Veja docs/SIGNING.md.
        run: |
          # Segredo que não existe chega como texto vazio; o electron-builder trataria como caminho de arquivo.
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          [ -z "$WIN_CSC_LINK" ] && unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID" ] && [ -n "$CSC_LINK" ]; then EXTRA="-c.mac.notarize=true"; fi
          ${{ matrix.dist }} $EXTRA
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: TalkFlowBy-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/latest.yml
            dist/*-windows-setup.exe.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
