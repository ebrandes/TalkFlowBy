appId: com.talkflowby.app
productName: TalkFlowBy
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/tray
    to: tray
    filter: ["*.png"]
  # Frases das permissões do macOS em português (ignorado no Windows).
  - from: build/locales/pt_BR.lproj
    to: pt_BR.lproj
mac:
  target:
    # A arquitetura vem da linha de comando (--arm64 ou --x64): o ffmpeg-static instalado
    # é da máquina que gera o pacote, então cada Mac gera o seu.
    - dmg
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  minimumSystemVersion: "14.2"
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: TalkFlowBy records your voice in the meetings you choose to record.
    NSAudioCaptureUsageDescription: TalkFlowBy records the call audio (the other participants' voices) in the meetings you choose to record.
    NSScreenCaptureUsageDescription: macOS requires this permission for TalkFlowBy to capture the call audio. No image of your screen is recorded.
    LSUIElement: false
win:
  artifactName: ${productName}-${version}-windows-setup.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: TalkFlowBy
